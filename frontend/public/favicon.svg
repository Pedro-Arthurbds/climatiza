<svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8CDA0" />
      <stop offset="100%" stop-color="#D58E5D" />
    </linearGradient>
    <linearGradient id="favIcon" x1="15%" y1="15%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#182323" />
      <stop offset="100%" stop-color="#2B4640" />
    </linearGradient>
  </defs>
  
  <rect width="48" height="48" rx="14" fill="url(#favBg)" />
  <rect x="0.5" y="0.5" width="47" height="47" rx="13.5" stroke="#FFFFFF" stroke-opacity="0.35" fill="none" />

  <!-- C contour -->
  <path d="M 33.5 13.5 C 28.5 8.5 19.8 8.5 14.8 13.8 C 9.2 19.5 9.2 28.5 14.8 34.2 C 19.8 39.5 28.5 39.5 33.5 34.5" 
        stroke="url(#favIcon)" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  
  <!-- Top airflow wave -->
  <path d="M 18.5 19.5 C 22.5 18 26.5 18 30 19.5" 
        stroke="url(#favIcon)" stroke-width="2.6" stroke-linecap="round" fill="none" />
  <circle cx="34" cy="19.5" r="1.6" fill="#182323" />
  
  <!-- Center airflow with ice diamond spark -->
  <path d="M 15.5 24 L 30 24" 
        stroke="url(#favIcon)" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <path d="M 35 24 L 37.5 21.5 L 40 24 L 37.5 26.5 Z" fill="#182323" />
  
  <!-- Bottom airflow wave -->
  <path d="M 18.5 28.5 C 22.5 30 26.5 30 30 28.5" 
        stroke="url(#favIcon)" stroke-width="2.6" stroke-linecap="round" fill="none" />
  <circle cx="34" cy="28.5" r="1.6" fill="#182323" />
</svg>